name: QQQ Day Trade Bot

on:
  schedule:
    # GitHub Actions cron uses UTC. During Central Daylight Time, 8:30 AM CT = 13:30 UTC.
    - cron: '15 8 * * 1-5'
  workflow_dispatch:
    inputs:
      execution_duration_minutes:
        description: 'Execution window in minutes after the 8:30 AM Central start time'
        required: false
        default: '315'

jobs:
  day-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Trading Secrets
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = ["ALPACA_API_KEY", "ALPACA_SECRET_KEY"]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              sys.exit(
                  "Missing required GitHub Actions secrets: "
                  + ", ".join(missing)
              )

          print("Day-trade secrets are configured.")
          PY

      - name: Run Sniper Agent
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          EXECUTION_DURATION_MINUTES: ${{ github.event.inputs.execution_duration_minutes || '315' }}
          PYTHONUNBUFFERED: '1'
        run: python -u scripts/qqq_dt_agent.py

  day-trade-momentum:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [QQQ, SPY, NVDA]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Trading Secrets
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = ["ALPACA_API_KEY", "ALPACA_SECRET_KEY"]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              sys.exit(
                  "Missing required GitHub Actions secrets: "
                  + ", ".join(missing)
              )

          print("Day-trade momentum secrets are configured.")
          PY

      - name: Run Momentum Agent
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          EXECUTION_DURATION_MINUTES: ${{ github.event.inputs.execution_duration_minutes || '315' }}
          SYMBOL: ${{ matrix.symbol }}
          PYTHONUNBUFFERED: '1'
        run: python -u scripts/day_trade_momentum.py

