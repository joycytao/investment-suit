name: S&P100 Put Selling Bot

on:
  schedule:
    # 使用 2026 最新支援的 timezone 功能，不再需要手動計算 UTC
    
    # 1. 持倉監控：美中 9:00，週一至週五
    - cron: '0 9 * * 1-5'
      timezone: 'America/Chicago'
    
    # 2. 主掃描與進場：美中 14:10，週二至週四
    - cron: '10 14 * * 2-4'
      timezone: 'America/Chicago'
    
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Trading Secrets
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = ["ALPACA_API_KEY", "ALPACA_SECRET_KEY"]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              sys.exit(
                  "Missing required GitHub Actions secrets: "
                  + ", ".join(missing)
              )

          print("Option-trade secrets are configured.")
          PY

      - name: Run Monitor Job (09:00 AM Chicago)
        if: github.event.schedule == '0 9 * * 1-5'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          JOB_TYPE: "MONITOR"
          PYTHONUNBUFFERED: '1'
        run: python -u scripts/trade_option-sell_put.py

      - name: Run Main Trading Job (02:10 PM Chicago)
        if: github.event.schedule == '10 14 * * 2-4' || github.event_name == 'workflow_dispatch'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          JOB_TYPE: "MAIN"
          PYTHONUNBUFFERED: '1'
        run: python -u scripts/trade_option-sell_put.py

      - name: Run Early Morning Job (05:30 AM Chicago)
        if: github.event.schedule == '30 5 * * 1-5'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          JOB_TYPE: "MONITOR"
          PYTHONUNBUFFERED: '1'
        run: python -u scripts/trade_option-sell_put.py