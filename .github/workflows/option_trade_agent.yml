name: S&P100 Put Selling Bot

on:
  schedule:
    # 使用 2026 最新支援的 timezone 功能，不再需要手動計算 UTC
    
    # 1. 持倉監控：美東 10:00，週一至週五
    - cron: '0 10 * * 1-5'
      timezone: 'America/Chicago'
    
    # 2. 主掃描與進場：美東 15:10，週二至週四
    - cron: '10 15 * * 2-4'
      timezone: 'America/Chicago'
    
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py pandas pandas-ta yfinance requests lxml

      - name: Run Monitor Job (10:00 AM New York)
        if: github.event.schedule == '0 10 * * 1-5'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          JOB_TYPE: "MONITOR"
        run: python trade_option-sell_put.py

      - name: Run Main Trading Job (03:10 PM New York)
        if: github.event.schedule == '10 15 * * 2-4' || github.event_name == 'workflow_dispatch'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          JOB_TYPE: "MAIN"
        run: python trade_option-sell_put.py

      - name: Run Early Morning Job (05:30 AM Chicago)
        if: github.event.schedule == '30 5 * * 1-5'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          JOB_TYPE: "MONITOR"
        run: python trade_option-sell_put.py