name: QQQ Day Trade Bot

permissions:
  actions: read
  contents: read

on:
  schedule:
    # Runs at 8:32 AM America/Chicago on weekdays.
    - cron: '27 8 * * 1-5'
      timezone: 'America/Chicago'
  workflow_dispatch:
    inputs:
      execution_duration_minutes:
        description: 'Execution window in minutes after the 8:32 AM Central start time'
        required: false
        default: '360'

jobs:
  day-trade-momentum:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [SPY, QQQ, NVDA]
    steps:
      - name: Skip If Another Run Is In Progress
        id: run-guard
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;
            const workflowId = context.workflow;
            const branch = context.ref.startsWith('refs/heads/')
              ? context.ref.slice('refs/heads/'.length)
              : undefined;

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: workflowId,
              branch,
              status: 'in_progress',
              per_page: 100,
            });

            const hasOtherActiveRun = runs.some((run) => run.id !== currentRunId);
            if (hasOtherActiveRun) {
              core.notice('Another run of this workflow is already in progress. Skipping this run.');
            }
            core.setOutput('skip', hasOtherActiveRun ? 'true' : 'false');

      - name: Checkout Code
        if: steps.run-guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.run-guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        if: steps.run-guard.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Trading Secrets
        if: steps.run-guard.outputs.skip != 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = ["ALPACA_API_KEY", "ALPACA_SECRET_KEY"]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              sys.exit(
                  "Missing required GitHub Actions secrets: "
                  + ", ".join(missing)
              )

          print("Day-trade momentum secrets are configured.")
          PY

      - name: Run Momentum Agent
        if: steps.run-guard.outputs.skip != 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          EXECUTION_DURATION_MINUTES: ${{ github.event.inputs.execution_duration_minutes || '315' }}
          SYMBOL: ${{ matrix.symbol }}
          PYTHONUNBUFFERED: '1'
        run: python -u scripts/day_trade_momentum.py