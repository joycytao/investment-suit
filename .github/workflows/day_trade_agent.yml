  diagnose-failure:
    runs-on: ubuntu-latest
    needs: [day-trade, day-trade-momentum, day-trade-options]
    if: failure()
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Invoke Repair Agent on Failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh agent run .github/prompts/repair-agent.prompt.md